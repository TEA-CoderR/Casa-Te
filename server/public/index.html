<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CASA & TE · Console demo</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">C<span>+</span></span><span>CASA <em>&</em> TE<small>CONSOLE</small></span></div>
      <div class="nav-label">WORKSPACE</div>
      <nav aria-label="Navigazione principale">
        <button class="nav-item active" data-page="overview"><span class="nav-icon">◫</span> Panoramica</button>
        <button class="nav-item" data-page="orders"><span class="nav-icon">▤</span> Ordini <span id="nav-count" class="nav-count">0</span></button>

  <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>

  <script src="/app.js" defer></script>
