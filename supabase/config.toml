# Supabase CLI configuration. `supabase link --project-ref <ref>` then `supabase db push`
# and `supabase functions deploy`. Local stack: `supabase start` (requires Docker).
project_id = "casa-te"

[api]
enabled = true
port = 54321
schemas = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "https://shop.example.com"
additional_redirect_urls = ["casate://**", "http://localhost:8081/**", "http://localhost:5173/**"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
otp_length = 6
otp_expiry = 900

[auth.rate_limit]
email_sent = 30

[storage]
enabled = true
file_size_limit = "5MiB"

# Functions authenticated by other means than a user JWT.
[functions.stripe-webhook]
verify_jwt = false

[functions.checkout-return]
verify_jwt = false

[functions.notify-order-event]
verify_jwt = false
